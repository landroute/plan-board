<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d23" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>板</title>
<style>
/* =====================================================
   配色と文字は day-clock（claude-tools/day-clock/day-clock.html）と揃えている。
   明るめダーク / ライトは端末の設定に従う（スマホで開くため。day-clock は ☀ / ☾ で切り替え）
   色を変えるときは両方を同時に直す
===================================================== */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  --bg:#f4f2ed;--surface:#fdfcfa;--surface2:#ebe7df;--line:#ddd7cc;--line2:#cbc4b7;--text:#24221e;--muted:#625c52;--faint:#9a9387;
  --accent:#12786a;--accent-soft:rgba(18,120,106,.08);--accent-ink:#fff;--warn:#b5582c;--warn-soft:rgba(181,88,44,.1);
  --scrim:rgba(60,45,20,.28);--tab-on:var(--surface);
  --shadow:0 1px 0 rgba(40,30,10,.03),0 10px 26px -16px rgba(40,30,10,.22);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1d23;--surface:#21252c;--surface2:#292e36;--line:#343a45;--line2:#444b57;--text:#eceef1;--muted:#a6adb8;--faint:#727a87;
    --accent:#5ad6bb;--accent-soft:rgba(90,214,187,.11);--accent-ink:#062a22;--warn:#f2ab66;--warn-soft:rgba(242,171,102,.14);
    --scrim:rgba(0,0,0,.5);--tab-on:var(--bg);--shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input,select{font-family:inherit}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.6 var(--font);
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding:8px 12px 0;
  padding-top:calc(8px + env(safe-area-inset-top));
}
.top{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:2px;flex:0 1 auto;min-width:0;margin-right:auto;overflow:auto;scrollbar-width:none;background:var(--surface2);padding:3px;border-radius:999px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; padding:6px 11px; border-radius:999px; font-size:13px;
  color:var(--muted); background:transparent; border:0; cursor:pointer; white-space:nowrap;
}
.tab.on{background:var(--tab-on); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.icon-btn{
  flex:none; width:36px;height:36px; border-radius:8px; border:1px solid var(--line);
  background:transparent; color:var(--muted); font-size:17px; cursor:pointer;
}
#status{font-size:12px;color:var(--faint);padding:6px 2px 8px;min-height:26px}
#status.err{color:var(--warn)}
main{padding:14px 12px 0}
.block{margin-bottom:20px}
.bhead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.bname{
  font-size:14px;font-weight:600;color:var(--text);background:transparent;border:0;
  padding:2px 6px;margin-left:-6px;border-radius:6px;cursor:pointer;font-family:inherit;
}
.bname:active{background:var(--surface2)}
.more{
  position:absolute;top:4px;right:4px;width:30px;height:26px;border:0;border-radius:6px;
  background:transparent;color:var(--muted);font-size:15px;cursor:pointer;line-height:1;
}
.more:active{background:var(--surface2)}
.lead{background:var(--surface2);border-radius:6px;margin:3px 0;border-left:3px solid var(--line2)}
.btime{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.bfree{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.bfree.over{color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.brow{display:flex;gap:8px}
.gutter{width:38px;flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.body{flex:1;min-width:0;position:relative}
/* 左端の色はプロジェクトの色（day-clock の点と同じ色） */
.task{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--faint); border-radius:10px;
  padding:8px 10px; display:flex; flex-direction:column; justify-content:space-between;
  gap:4px; cursor:pointer; position:relative; box-shadow:var(--shadow);
}
.task.done{opacity:.45}
.task.done .ttxt{text-decoration:line-through}
/* 高さは所要分数に比例させるが、文字は決して潰さない（min-height + 2行クランプ） */
.ttxt{
  font-size:14px;color:var(--text);line-height:1.35;padding-right:26px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tmin{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 余白は「埋める空白」ではなく確保済みの余白。背景よりわずかに明るい帯にとどめる */
.buf{background:var(--surface);border-radius:6px;margin:3px 0}
.add{
  width:100%; margin-top:4px; padding:9px; border-radius:10px; cursor:pointer;
  border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:13px;
}
.nowline{position:absolute;left:-38px;right:0;height:0;border-top:1.5px solid var(--accent);z-index:5}
.nowline span{
  position:absolute;left:0;top:-9px;font-size:10px;color:var(--accent-ink);background:var(--accent);
  padding:0 6px;border-radius:999px;font-variant-numeric:tabular-nums;
}
#box{border-top:1px solid var(--line);margin:8px 12px 0;padding:12px 0 16px}
.boxlabel{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:13px;padding:5px 12px;border-radius:999px;background:transparent;
  border:1px solid var(--line);color:var(--text);cursor:pointer;
}
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{
  width:100%;max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));
}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ptitle{font-size:15px;font-weight:600;flex:1}
.sec{font-size:11px;letter-spacing:.14em;color:var(--faint);margin:16px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.rtxt{flex:1;font-size:14px;line-height:1.4}
.rmin{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
input[type=text],input[type=password],input[type=number]{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font-size:15px;
}
input:focus{outline:1.5px solid var(--accent);border-color:transparent}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.btn{
  padding:9px 16px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--faint);line-height:1.6;margin-top:8px}
.act{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:3px}
.sug{
  display:inline-block;margin-top:5px;font-size:11px;padding:3px 10px;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);font-variant-numeric:tabular-nums;cursor:pointer;
}
.empty{color:var(--faint);font-size:13px;padding:20px 0;text-align:center}
input[type=date]{
  width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font-size:15px;font-family:inherit;
}
input[type=color]{width:100%;height:42px;padding:3px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
@media (min-width:800px){ .panel{max-width:760px;margin:0 auto} }
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.badge{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);vertical-align:2px;font-weight:600}
.for{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;flex:none}
.late{color:var(--warn)}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb{border:0;border-bottom:1px dotted var(--faint);background:transparent;color:var(--text);font:inherit;cursor:pointer;padding:2px 0}
.row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);border-radius:9px;padding-left:8px;padding-right:8px}
.row.dim{opacity:.5}
.tnote{color:var(--muted)}
.placefoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 6px;
  display:flex;gap:8px;border-top:1px solid var(--line);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;margin-bottom:10px;background:var(--bg)}
.stage.done{opacity:.75}
.srow,.prow{display:flex;gap:6px;align-items:center}
.prow{margin-top:8px;flex-wrap:wrap}
.prow input[type=text]{flex:1 1 100%}
.prow input[type=number]{width:80px;flex:none}
.prow .mini{margin-left:auto}
.mini{flex:none;min-width:34px;height:38px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.donebox{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.add.small{padding:6px;font-size:12px}
.chip input{width:auto;margin:0 4px 0 0;vertical-align:-1px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.edfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 8px;
  border-top:1px solid var(--line);margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edfoot .err{width:100%;color:var(--warn);font-size:13px}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:8px}
.psettings{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.psettings summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.unsaved{font-size:12px;color:var(--warn);margin-left:auto}
.crumbs b{color:var(--text);font-weight:600}
.textbtn{flex:none;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);font-size:13px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="tabs" id="tabs"></div>
    <button class="textbtn" id="plan-btn">計画</button>
    <button class="icon-btn" id="reload-btn" aria-label="再読み込み">&#8635;</button>
    <button class="icon-btn" id="settings-btn" aria-label="設定">&#9881;</button>
  </div>
  <div id="status">読み込み中…</div>
</header>

<main id="timeline"></main>

<section id="box">
  <div class="boxlabel">箱 — 未配置</div>
  <div class="chips" id="chips"></div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <div class="phead">
      <div class="ptitle" id="sheet-title">置く</div>
      <button class="btn" id="sheet-close">閉じる</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="sheet" id="plan" hidden>
  <div class="panel" style="max-height:94vh">
    <div class="phead">
      <div class="ptitle" id="plan-title">計画</div>
      <button class="btn" id="plan-close">閉じる</button>
    </div>
    <div id="plan-body"></div>
  </div>
</div>

<div class="sheet" id="settings" hidden>
  <div class="panel">
    <div class="phead">
      <div class="ptitle">設定</div>
      <button class="btn" id="settings-close">閉じる</button>
    </div>
    <label class="f">リポジトリ（owner/repo）</label>
    <input type="text" id="cfg-repo" placeholder="landroute/plan-data">
    <label class="f">GitHub トークン（fine-grained・plan-data のみ・Contents: Read and write）</label>
    <input type="password" id="cfg-token" placeholder="github_pat_...">
    <label class="f">ntfy トピック（予告通知。空なら通知しない）</label>
    <input type="text" id="cfg-ntfy" placeholder="長いランダム文字列">
    <label class="f">何分前に鳴らすか</label>
    <input type="number" id="cfg-before" value="5" min="1" max="60" step="1" style="width:110px">
    <label class="row" style="cursor:pointer;margin-top:10px">
      <input type="checkbox" id="cfg-include" style="width:auto;flex:none">
      <div class="rtxt">通知にタスク本文を載せる</div>
    </label>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn pri" id="cfg-save">保存して読み込む</button>
      <button class="btn" id="cfg-test">テスト通知</button>
      <button class="btn" id="cfg-clear">トークンを消す</button>
    </div>
    <p class="hint">
      ntfy.sh は第三者の公開サーバで、<b>トピック名を知っていれば誰でも購読できます</b>。
      既定ではブロック名だけを送り、タスク本文は載せません。
      トピックは推測されない長いランダム文字列にしてください。
    </p>
    <p class="hint">
      トークンはこの端末のブラウザ内（localStorage）にのみ保存されます。
      <b>権限は plan-data だけ</b>に絞ってください。claude-tools には触れない設定にすること。
      端末を紛失したら GitHub 側でトークンを失効させてください。
    </p>
  </div>
</div>

<script>
/* =====================================================
   板 — プランを組む単体Webアプリ
   真実は plan-data/plan.json。書き手はこの板だけ（一方通行）
===================================================== */

/* 既定スケジュール。day-clock の BASE_SCHEDULE と同じ定義を持つ */
const BASE_SCHEDULE = {
  weekday:[
    {label:'Primary',s:'18:00',e:'19:00'},
    {label:'DP',s:'19:00',e:'20:30'},
    {label:'Free',s:'20:30',e:'21:45'},
    {label:'終了処理',s:'21:45',e:'22:00'},
    {label:'瞑想',s:'22:00',e:'22:15'}
  ],
  fri:[
    {label:'Primary',s:'18:00',e:'19:00'},
    {label:'DP',s:'19:00',e:'20:30'},
    {label:'Free',s:'20:30',e:'24:00'}
  ],
  sat:[
    {label:'Free',s:'10:00',e:'18:00'},
    {label:'Primary',s:'18:00',e:'19:00'},
    {label:'DP',s:'19:00',e:'20:30'},
    {label:'Free',s:'20:30',e:'24:00'}
  ],
  sun:[
    {label:'Free',s:'10:00',e:'18:00'},
    {label:'Primary',s:'18:00',e:'19:00'},
    {label:'DP',s:'19:00',e:'20:30'},
    {label:'Free',s:'20:30',e:'21:45'},
    {label:'終了処理',s:'21:45',e:'22:00'},
    {label:'瞑想',s:'22:00',e:'22:15'}
  ]
};
function baseFor(dow){
  if(dow>=1&&dow<=4) return BASE_SCHEDULE.weekday;
  if(dow===5) return BASE_SCHEDULE.fri;
  if(dow===6) return BASE_SCHEDULE.sat;
  return BASE_SCHEDULE.sun;
}

const PX_PER_MIN = 2.2, MIN_CARD_H = 40;
const DAY = ['日','月','火','水','木','金','土'];
const pad = n => String(Math.floor(n)).padStart(2,'0');
const hm  = s => { const p=String(s).split(':').map(Number); return p[0]*60+(p[1]||0); };
const fmt = m => pad(m/60)+':'+pad(m%60);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- 設定 ---------- */
const CFG_KEY='board.cfg', CACHE_KEY='board.cache';
let cfg = { repo:'landroute/plan-data', token:'', ntfy:'' };
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY)||'{}')); }catch(e){}
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} }

/* ---------- 状態 ----------
   projects = projects.json（大=プロジェクト → 中=工程 → 小=1手の型 と、計画） */
let plan=null, projects=null, shaPlan=null, shaProjects=null, dayOffset=0, dirty=false, saveTimer=null;
let timelogText='', shaTimelog=null, timelogDirty=false;

/* ---------- 型の id（大/中/小）を引く ----------
   day-clock の server.js にも同じ仕様の resolvePreset() がある（別リポジトリなので二重に持つ）。
   aliases は旧 2 階層の id（blender/blockout など）を過去の plan.json から引くためだけに使う */
function projList(){ return (projects && projects.projects) || []; }
function presetIndex(){
  const m={};
  for(const p of projList()) for(const s of (p.stages||[])) for(const x of (s.presets||[])){
    const r={p:p, s:s, x:x, id:p.id+'/'+s.id+'/'+x.id};
    m[r.id]=r;
    for(const a of (x.aliases||[])) if(!m[a]) m[a]=r;
  }
  return m;
}
function resolvePreset(id){ return id ? (presetIndex()[id] || null) : null; }
const md = s => { const p=String(s).split('-').map(Number); return p[1]+'/'+p[2]; };
function daysUntil(s){ const p=String(s).split('-').map(Number), t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(p[0],p[1]-1,p[2])-t)/86400000); }
/* 工程の状態。期日のある工程の期間は「前の工程の期日（最初はプロジェクトの開始日）〜自分の期日」 */
function stageStatus(p, s){
  if(s.doneAt) return 'done';
  if(!s.due) return 'cont';
  const today=ymd(new Date());
  if(s.due<today) return 'late';
  let from=p.start||today;
  for(const x of p.stages){ if(x===s) break; if(x.due) from=x.due; }
  return from<=today ? 'active' : 'todo';
}
const ST_LABEL={done:'完了',active:'進行中',late:'期限切れ',todo:'未着手',cont:'継続'};

/* ---------- UTF-8 安全な base64 ---------- */
function b64enc(str){
  const bytes=new TextEncoder().encode(str);
  let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- GitHub API ---------- */
async function ghGet(file){
  const r=await fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+file,{
    headers:{ Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json' },
    cache:'no-store'
  });
  if(r.status===404) return {missing:true};
  if(!r.ok) throw new Error(file+': HTTP '+r.status+(r.status===401?'（トークンを確認）':''));
  const j=await r.json();
  return { text:b64dec(j.content), sha:j.sha };
}
async function ghPut(file, text, sha, message){
  const r=await fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+file,{
    method:'PUT',
    headers:{ Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json',
              'Content-Type':'application/json' },
    body: JSON.stringify({ message:message, content:b64enc(text), sha:sha })
  });
  if(r.status===409 || r.status===422){ const e=new Error('conflict'); e.conflict=true; throw e; }
  if(!r.ok) throw new Error('保存失敗: HTTP '+r.status);
  const j=await r.json();
  return j.content.sha;
}

/* ---------- 日付 ---------- */
function dateAt(off){ const d=new Date(); d.setDate(d.getDate()+off); return d; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/* その日のブロック。plan に無ければ既定スケジュールを返す（保存はしない） */
function blocksFor(off){
  const d=dateAt(off), key=ymd(d);
  const stored=plan && plan.days && plan.days[key];
  const base=baseFor(d.getDay()).map(b=>({label:b.label,s:b.s,e:b.e,tasks:[]}));
  if(!stored || !Array.isArray(stored.blocks)) return base;
  const out=base.map(b=>{
    const m=stored.blocks.find(x=>String(x.label).toLowerCase()===b.label.toLowerCase());
    return m ? {label:b.label, s:m.s||b.s, e:m.e||b.e, tasks:(m.tasks||[]).slice()} : b;
  });
  for(const sb of stored.blocks){
    if(!out.some(b=>b.label.toLowerCase()===String(sb.label).toLowerCase()))
      out.push({label:sb.label,s:sb.s,e:sb.e,tasks:(sb.tasks||[]).slice()});
  }
  out.sort((a,b)=>hm(a.s)-hm(b.s));
  return out;
}

/* 編集するときに、その日を plan に実体化する */
function materialize(off){
  const key=ymd(dateAt(off));
  if(!plan.days) plan.days={};
  if(!plan.days[key]) plan.days[key]={blocks:blocksFor(off)};
  return plan.days[key];
}
function bufferMin(){ return (projects && projects.bufferMin!=null) ? projects.bufferMin : 5; }

/* ---------- 描画 ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML=[0,1,2].map(o=>{
    const d=dateAt(o);
    const name = o===0?'今日' : o===1?'明日' : (d.getMonth()+1)+'/'+d.getDate();
    return '<button class="tab '+(o===dayOffset?'on':'')+'" data-off="'+o+'">'+name+'('+DAY[d.getDay()]+')</button>';
  }).join('');
}

function renderTimeline(){
  const el=document.getElementById('timeline');
  if(!plan){ el.innerHTML='<div class="empty">設定からトークンを入れてください</div>'; return; }
  const blocks=blocksFor(dayOffset);
  const now=new Date(), nm=now.getHours()*60+now.getMinutes(), isToday=(dayOffset===0);
  const buf=bufferMin();

  el.innerHTML=blocks.map((b,bi)=>{
    const s=hm(b.s), e=hm(b.e), dur=Math.max(1,e-s);
    const used=b.tasks.reduce((a,t)=>a+(t.min||0)+(t.lead||0),0) + buf*b.tasks.length;
    const free=dur-used;

    let body='';
    for(let ti=0; ti<b.tasks.length; ti++){
      const t=b.tasks[ti];
      // lead = そのタスクの前に明示的に空けた時間。バッファと同じ見た目だが左に印を付ける
      if(t.lead) body+='<div class="lead" style="height:'+Math.max(8,t.lead*PX_PER_MIN)+'px"></div>';
      const h=Math.max(MIN_CARD_H,(t.min||0)*PX_PER_MIN);
      const r=resolvePreset(t.preset);   // 左端の色でどのプロジェクトの1手かを見せる
      body+='<div class="task '+(t.done?'done':'')+'" style="min-height:'+h+'px'+(r&&r.p.color?';border-left:4px solid '+esc(r.p.color):'')+'" data-b="'+bi+'" data-t="'+ti+'">'+
            '<div class="ttxt">'+esc(t.text)+(t.note?' <span class="tnote">· '+esc(t.note)+'</span>':'')+'</div>'+
            '<div class="tmin">'+(r?esc(r.p.name)+' › '+esc(r.s.name)+' · ':'')+(t.min||0)+'分</div>'+
            '<button class="more" data-more="'+bi+':'+ti+'" aria-label="操作">&#8943;</button></div>';
      body+='<div class="buf" style="height:'+Math.max(6,buf*PX_PER_MIN)+'px"></div>';
    }
    // 余白帯は上限を設ける（長い空きが画面を占有しても読み取れる情報は増えないため）
    if(free>0) body+='<div class="buf" style="height:'+Math.max(8,Math.min(free,24)*PX_PER_MIN)+'px"></div>';
    body+='<button class="add" data-add="'+bi+'">＋ ここに置く</button>';

    let nowline='';
    if(isToday && nm>=s && nm<e)
      nowline='<div class="nowline" style="top:'+(((nm-s)/dur)*100)+'%"><span>'+fmt(nm)+'</span></div>';

    return '<div class="block"><div class="bhead">'+
      '<button class="bname" data-block="'+bi+'">'+esc(b.label)+'</button>'+
      '<span class="btime">'+b.s+'–'+b.e+'</span>'+
      '<span class="bfree '+(free<0?'over':'')+'">'+(free<0?((-free)+'分 超過'):('余白 '+free+'分'))+'</span>'+
      '</div><div class="brow"><div class="gutter">'+b.s+'</div>'+
      '<div class="body">'+body+nowline+'</div></div></div>';
  }).join('');
}

    h+='<div class="crumbs"><button class="crumb" data-pk="root">すべて</button> › '+
       (S ? '<button class="crumb" data-pk="p">'+esc(P.name)+'</button> › <b>'+esc(S.name)+'</b>' : '<b>'+esc(P.name)+'</b>')+'</div>';

    const list=projList().filter(p=>!p.archived).slice()
      .sort((a,b)=>((b.blocks||[]).indexOf(label)>=0)-((a.blocks||[]).indexOf(label)>=0));
    h+=list.map(p=>{
      const due=p.goal&&p.goal.due;
      return '<div class="row" data-pk-p="'+esc(p.id)+'"><span class="dot" style="background:'+esc(p.color||'#888')+'"></span>'+

        (due?'<div class="act">◆ '+md(due)+' · あと'+daysUntil(due)+'日</div>':'')+'</div>'+
        ((p.blocks||[]).indexOf(label)>=0?'<span class="for">この枠向け</span>':'')+'<div class="rmin">›</div></div>';
    }).join('') || '<div class="empty">プロジェクトがありません。「計画」から作ってください</div>';
  }else if(!S){
    const ord={late:0,active:1,cont:2,todo:3,done:4};
    h+=P.stages.slice().sort((a,b)=>ord[stageStatus(P,a)]-ord[stageStatus(P,b)]).map(s=>{
      const st=stageStatus(P,s);
      const sub= st==='done' ? '完了 '+md(s.doneAt) : st==='cont' ? '継続' :
                 st==='late' ? '期限切れ '+(-daysUntil(s.due))+'日' : (st==='todo'?'未着手 · ':'')+'期日 '+md(s.due)+' · あと'+daysUntil(s.due)+'日';
      return '<div class="row '+(st==='done'?'dim':'')+'" data-pk-s="'+esc(s.id)+'"><div class="rtxt">'+esc(s.name)+
        '<div class="act '+(st==='late'?'late':'')+'">'+sub+'</div></div><div class="rmin">›</div></div>';
    }).join('') || '<div class="empty">工程がありません</div>';
  }else{
    h+=S.presets.map(x=>{
      const id=P.id+'/'+S.id+'/'+x.id, a=actualsFor(id), m=median(a);
      let extra='';
      if(m!=null){
        // 3回以上たまり、目安と5分以上ずれたときだけ更新を提案する（自動では変えない）
        extra = (a.length>=3 && Math.abs(m-x.min)>=5)
          ? '<div class="sug" data-est="'+esc(id)+':'+m+'">実績 '+m+'分 · '+a.length+'回 → 目安を'+m+'分に？</div>'
          : '<div class="act">実績 '+m+'分 · '+a.length+'回</div>';

      return '<div class="row '+(pick.x===x.id?'sel':'')+'" data-pk-x="'+esc(x.id)+'">'+
        '<div class="rtxt">'+esc(x.text)+extra+'</div><div class="rmin">'+x.min+'分</div></div>';
    }).join('') || '<div class="empty">型がありません。「計画」から足してください</div>';
    if(X){
      h+='<div class="placefoot"><input type="text" id="pk-note" maxlength="40" placeholder="補足（任意）: 対象を短く　例: 北側の橋">'+
         '<button class="btn pri" id="pk-place" style="flex:none">置く</button></div>';
    }
  }
  document.getElementById('sheet-body').innerHTML=h;
  if(X){ const n=document.getElementById('pk-note'); n.scrollIntoView({block:'nearest'}); n.focus(); }

function placeTask(text, min, presetId, note){
  const day=materialize(dayOffset);

/* ---------- 動かす ---------- */
let rippleOn=false;

/* 表示上のブロックに対応する、plan.json 側の実体を返す（無ければ作る） */
function storedBlock(bi){
  const day=materialize(dayOffset), v=blocksFor(dayOffset)[bi];
  let b=day.blocks.find(x=>String(x.label).toLowerCase()===v.label.toLowerCase());
  if(!b){ b={label:v.label,s:v.s,e:v.e,tasks:[]}; day.blocks.push(b); }
  if(!Array.isArray(b.tasks)) b.tasks=[];
  return b;
}
function moveTask(bi,ti,dir){
  const b=storedBlock(bi), j=ti+dir;
  if(j<0||j>=b.tasks.length) return;
  const x=b.tasks[ti]; b.tasks[ti]=b.tasks[j]; b.tasks[j]=x;
  markDirty(); render();
}
/* lead = そのタスクの前に空ける時間。余白が先に食われ、尽きると「超過」が出る */
function adjustLead(bi,ti,d){
  const t=storedBlock(bi).tasks[ti]; if(!t) return;
  t.lead=Math.max(0,(t.lead||0)+d); if(!t.lead) delete t.lead;
  markDirty(); render();
}
function adjustMin(bi,ti,d){
  const t=storedBlock(bi).tasks[ti]; if(!t) return;
  t.min=Math.max(5,(t.min||0)+d);
  markDirty(); render();
}
function taskToBox(bi,ti){
  const b=storedBlock(bi), t=b.tasks[ti]; if(!t) return;
  b.tasks.splice(ti,1);
  if(!plan.inbox) plan.inbox=[];
  plan.inbox.push({id:uid(), text:t.text});
  markDirty(); render();
}
function removeTask(bi,ti){ storedBlock(bi).tasks.splice(ti,1); markDirty(); render(); }

/* ブロックごと動かす。ripple が無いときは隣と重ならない範囲に丸める
   （重なると day-clock 側でどちらが現ブロックか決まらなくなるため） */
function shiftBlock(bi,delta,ripple){
  const day=materialize(dayOffset), view=blocksFor(dayOffset), target=view[bi];
  const tS=hm(target.s), tE=hm(target.e);
  const after=view.filter((b,i)=> i!==bi && hm(b.s)>=tS);
  const before=view.filter((b,i)=> i!==bi && hm(b.e)<=tS);
  let d=delta;
  if(!ripple){
    const nextS=after.length?Math.min.apply(null,after.map(b=>hm(b.s))):1440;
    const prevE=before.length?Math.max.apply(null,before.map(b=>hm(b.e))):0;
    d=Math.max(prevE-tS, Math.min(d, nextS-tE));
  }
  if(d===0){ setStatus('隣のブロックに当たります。「以降もまとめて」を入れてください', true); return; }
  const apply=(label,ns,ne)=>{
    let b=day.blocks.find(x=>String(x.label).toLowerCase()===label.toLowerCase());
    if(!b){ b={label:label,s:'',e:'',tasks:[]}; day.blocks.push(b); }
    b.s=fmt(Math.max(0,Math.min(1440,ns))); b.e=fmt(Math.max(0,Math.min(1440,ne)));
  };
  apply(target.label, tS+d, tE+d);
  if(ripple) for(const b of after) apply(b.label, hm(b.s)+d, hm(b.e)+d);
  markDirty(); render();
}

/* 遅れたときに考えることをゼロにする。終了時刻は動かさない＝枠が短くなり、
   入り切らなければ「超過」として見える */
function startNow(bi){
  const day=materialize(dayOffset), v=blocksFor(dayOffset)[bi];
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  if(nm>=hm(v.e)){ setStatus('このブロックはもう終わっています', true); return; }
  // 「遅れているとき」専用。まだ始まっていない枠に使うと巨大なブロックになってしまう
  if(nm<hm(v.s)){ setStatus('まだ始まっていません。早めるなら「15分 早める」を使ってください', true); return; }
  const b=day.blocks.find(x=>String(x.label).toLowerCase()===v.label.toLowerCase());
  if(!b) return;
  b.s=fmt(nm);
  for(const t of (b.tasks||[])) delete t.lead;
  markDirty(); render();
}

/* ---------- 変更と保存 ---------- */
function markDirty(){
  dirty=true; setStatus('未保存…');
  cacheLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save, 1500);
}
function cacheLocal(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({plan:plan,projects:projects,shaPlan:shaPlan,at:Date.now()})); }catch(e){}
}
async function save(){
  if(!dirty || !cfg.token) return;
  if(!navigator.onLine){ setStatus('オフライン — 復帰時に保存します'); return; }
  try{
    setStatus('保存中…');
    plan.updatedAt=new Date().toISOString();
    shaPlan=await ghPut('plan.json', JSON.stringify(plan,null,2)+'\n', shaPlan, 'plan: 板から更新');
    dirty=false;
    if(timelogDirty){
      shaTimelog=await ghPut('timelog.jsonl', timelogText, shaTimelog, 'timelog: 実績を追記');
      timelogDirty=false;
    }
    cacheLocal();
    setStatus('保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
    await syncNotifications();
    if(dirty) setTimeout(save, 200);   // 予約IDが付いたので、もう一度だけ保存する
  }catch(e){
    if(e.conflict) setStatus('他の端末で更新されています。再読み込みしてください', true);
    else setStatus(e.message, true);
  }
}

/* ---------- 実績（timelog.jsonl は追記のみ） ---------- */
function appendTimelog(rec){
  const nl = (timelogText && timelogText.slice(-1)!=='\n') ? '\n' : '';
  timelogText = (timelogText||'') + nl + JSON.stringify(rec) + '\n';
  timelogDirty=true;
}
function removeTimelog(atIso){
  if(!timelogText) return;
  const keep=timelogText.split('\n').filter(function(l){
    if(!l.trim()) return false;
    try{ return JSON.parse(l).at!==atIso; }catch(e){ return true; }
  });
  timelogText = keep.length ? keep.join('\n')+'\n' : '';
  timelogDirty=true;
}
/* 開始 = 同じブロックで直前に完了したタスクの完了時刻。無ければブロック開始時刻 */
function buildRecord(bi,ti){
  if(dayOffset!==0) return null;               // 今日以外のタップは実測にならない
  const v=blocksFor(dayOffset)[bi], b=storedBlock(bi), t=b.tasks[ti];
  if(!t || !t.doneAt) return null;
  let startMin=hm(v.s);
  for(let j=0;j<ti;j++){
    const p=b.tasks[j];
    if(p && p.doneAt){ const pd=new Date(p.doneAt); startMin=Math.max(startMin, pd.getHours()*60+pd.getMinutes()); }
  }
  const d=new Date(t.doneAt);
  const actual=(d.getHours()*60+d.getMinutes())-startMin;
  if(actual<1 || actual>240) return null;      // 明らかに実測でないものは欠測として捨てる
  const rec={ at:t.doneAt, date:ymd(dateAt(0)), block:v.label,
           preset:t.preset||null, text:t.text, est:t.min||0, actual:actual };
  if(t.note) rec.note=t.note;
  return rec;
}
/* 旧 2 階層の id で記録された実績も、aliases で今の型に寄せて数える */
function actualsFor(presetId){
  if(!timelogText || !presetId) return [];
  const idx=presetIndex(), want=idx[presetId] ? idx[presetId].id : presetId;
  const out=[];
  const lines=timelogText.split('\n');
  for(let i=0;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    try{
      const r=JSON.parse(lines[i]);
      const got=r.preset && idx[r.preset] ? idx[r.preset].id : r.preset;
      if(got===want && r.actual>0) out.push(r.actual);
    }catch(e){}
  }
  return out.slice(-7);
}
function median(a){
  if(!a.length) return null;
  const s=a.slice().sort(function(x,y){return x-y;}), m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2);
}
/* 目安は自動で書き換えない。承認されたときだけ projects.json を更新する */
async function applyEstimate(presetId, minutes){
  const r=resolvePreset(presetId);
  if(!r) return;
  const before=r.x.min;
  r.x.min=minutes;
  try{
    setStatus('目安を更新中…');
    shaProjects=await ghPut('projects.json', JSON.stringify(projects,null,2)+'\n', shaProjects, 'projects: 実績から目安を更新');
    cacheLocal();
    setStatus('「'+r.x.text.slice(0,16)+'」の目安を '+minutes+'分 にしました');
  }catch(e){
    r.x.min=before;
    setStatus(e.conflict?'他の端末で計画が更新されています。再読み込みしてください':e.message, true);
  }
  renderPlaceSheet();
}

/* ---------- ntfy（予告の予約） ----------
   板から直接予約するので、Surface が落ちていても鳴る。
   予定が変わったら DELETE して貼り直す（ntfy は上限3日） */
async function ntfyPublish(body){
  const r=await fetch('https://ntfy.sh/', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error('ntfy: HTTP '+r.status);
  return r.json();
}
function ntfyDelete(id){
  return fetch('https://ntfy.sh/'+encodeURIComponent(cfg.ntfy)+'/'+encodeURIComponent(id)+'/delete')
    .catch(function(){});
}
function notifyFingerprint(){
  const parts=[];
  for(let off=0; off<3; off++){
    const key=ymd(dateAt(off));
    const bs=blocksFor(off);
    for(let i=0;i<bs.length;i++){
      const open=bs[i].tasks.find(function(t){return !t.done;});
      if(open) parts.push(key+'|'+bs[i].label+'|'+bs[i].s+'|'+open.text);
    }
  }
  return parts.join('~')+'|'+(cfg.notifyBefore||5)+'|'+(cfg.notifyIncludeTask?1:0);
}
async function syncNotifications(){
  if(!cfg.ntfy) return;
  const fp=notifyFingerprint();
  if(fp===(plan.notifyFp||'')) return;
  const old=plan.notify||[];
  for(let i=0;i<old.length;i++) await ntfyDelete(old[i].id);
  const made=[], before=Number(cfg.notifyBefore||5), now=Date.now();
  for(let off=0; off<3; off++){
    const d=dateAt(off), bs=blocksFor(off);
    for(let i=0;i<bs.length;i++){
      const b=bs[i];
      const open=b.tasks.find(function(t){return !t.done;});
      if(!open) continue;
      const fire=new Date(d); fire.setHours(0,0,0,0); fire.setMinutes(hm(b.s)-before);
      if(fire.getTime()<=now+15000) continue;                  // 過ぎている / 直近すぎる
      if(fire.getTime()>now+3*86400000-60000) continue;        // ntfy の上限3日
      try{
        const res=await ntfyPublish({
          topic:cfg.ntfy,
          title:'もうすぐ '+b.label+'（'+b.s+'）',
          message: cfg.notifyIncludeTask ? open.text+(open.note?' · '+open.note:'') : '次の1手はプランに入っています',
          delay:String(Math.floor(fire.getTime()/1000)),
          tags:['alarm_clock']
        });
        if(res && res.id) made.push({id:res.id, at:b.s, label:b.label, date:ymd(d)});
      }catch(e){ setStatus('通知の予約に失敗: '+e.message, true); return; }
    }
  }
  plan.notify=made; plan.notifyFp=fp; dirty=true;
  setStatus('予告を '+made.length+'件 予約しました');
}

/* ---------- 読み込み ---------- */
async function loadAll(){
  if(!cfg.token){ setStatus('設定からトークンを入れてください', true); renderFromCache(); return; }
  try{
    setStatus('読み込み中…');
    const res=await Promise.all([ghGet('plan.json'), ghGet('projects.json'), ghGet('timelog.jsonl')]);
    const p=res[0], pr=res[1], tl=res[2];
    if(p.missing){ plan={version:1,days:{},inbox:[]}; shaPlan=null; }
    else { plan=JSON.parse(p.text); shaPlan=p.sha; }
    if(pr.missing){ projects={version:2,bufferMin:5,projects:[]}; shaProjects=null; }
    else { projects=JSON.parse(pr.text); shaProjects=pr.sha; }
    if(!Array.isArray(projects.projects)) projects.projects=[];
    if(tl.missing){ timelogText=''; shaTimelog=null; }
    else { timelogText=tl.text; shaTimelog=tl.sha; }
    timelogDirty=false;
    if(!plan.days) plan.days={};
    if(!plan.inbox) plan.inbox=[];
    dirty=false; cacheLocal(); render();
    setStatus('同期 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
    // 設定変更（何分前・本文の有無）も指紋に入っているので、ここで貼り直しが走る
    syncNotifications().then(function(){ if(dirty) save(); });
  }catch(e){
    setStatus(e.message+' — キャッシュを表示します', true);
    renderFromCache();
  }
}
function renderFromCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c && c.plan){ plan=c.plan; projects=c.projects||null; shaPlan=c.shaPlan; }
  }catch(e){}
  render();
}

/* ---------- イベント ---------- */
document.getElementById('tabs').addEventListener('click', function(e){
  const b=e.target.closest('[data-off]'); if(!b) return;
  dayOffset=Number(b.dataset.off); render();
});
document.getElementById('timeline').addEventListener('click', function(e){
  // ⋯ とブロック名は、カードの完了トグルより先に拾う
  const more=e.target.closest('[data-more]');
  if(more){ const p=more.dataset.more.split(':'); openTaskSheet(Number(p[0]),Number(p[1])); return; }
  const blk=e.target.closest('[data-block]');
  if(blk){ openBlockSheet(Number(blk.dataset.block)); return; }
  const add=e.target.closest('[data-add]');
  if(add){ openSheet(Number(add.dataset.add)); return; }
  const t=e.target.closest('.task');
  if(t){
    const blocks=blocksFor(dayOffset), label=blocks[Number(t.dataset.b)].label;
    const day=materialize(dayOffset);
    const b=day.blocks.find(x=>String(x.label).toLowerCase()===label.toLowerCase());
    const ti=Number(t.dataset.t), task=b && b.tasks[ti];
    if(task){
      task.done=!task.done;
      if(task.done){
        task.doneAt=new Date().toISOString();
        const rec=buildRecord(Number(t.dataset.b), ti);
        if(rec) appendTimelog(rec);          // 実測にならない回は記録しない（欠測）
      }else{
        const old=task.doneAt; delete task.doneAt;
        if(old) removeTimelog(old);
      }
      markDirty(); render();
    }
  }
});
document.getElementById('chips').addEventListener('click', function(e){
  if(e.target.closest('[data-newbox]')){
    const txt=prompt('箱に入れる1行'); if(!txt) return;
    if(!plan.inbox) plan.inbox=[];
    plan.inbox.push({id:uid(), text:txt.trim()});
    markDirty(); render();
  }
});
document.getElementById('sheet').addEventListener('click', function(e){
  if(e.target.id==='sheet'){ closeSheet(); return; }
  if(e.target.id==='ripple'){ rippleOn=e.target.checked; return; }
  const act=e.target.closest('[data-act]');
  if(act){
    const p=act.dataset.act.split(':'), op=p[0], bi=Number(p[1]), ti=Number(p[2]);
    if(op==='up'||op==='down'){ moveTask(bi,ti,op==='up'?-1:1); closeSheet(); return; }
    if(op==='box'){ taskToBox(bi,ti); closeSheet(); return; }
    if(op==='del'){ removeTask(bi,ti); closeSheet(); return; }
    if(op==='now'){ startNow(bi); closeSheet(); return; }
    if(op==='lead-') adjustLead(bi,ti,-15);
    else if(op==='lead+') adjustLead(bi,ti,15);
    else if(op==='min-') adjustMin(bi,ti,-5);
    else if(op==='min+') adjustMin(bi,ti,5);
    else if(op==='blk-') shiftBlock(bi,-15,rippleOn);
    else if(op==='blk+') shiftBlock(bi,15,rippleOn);
    // 最新の値を出すために開き直す
    if(op.indexOf('blk')===0) openBlockSheet(bi); else openTaskSheet(bi,ti);
    return;
  }
  // 提案バッジは行より先に拾う（押しても型を選んでしまわないように）
  const est=e.target.closest('[data-est]');
  if(est){
    e.stopPropagation();
    const q=est.dataset.est, k=q.lastIndexOf(':');
    applyEstimate(q.slice(0,k), Number(q.slice(k+1)));
    return;
  }
  const crumb=e.target.closest('[data-pk]');
  if(crumb){
    if(crumb.dataset.pk==='root') pick={p:null,s:null,x:null}; else pick={p:pick.p,s:null,x:null};
    renderPlaceSheet(); return;
  }
  const pp=e.target.closest('[data-pk-p]');
  if(pp){ pick={p:pp.dataset.pkP,s:null,x:null}; renderPlaceSheet(); return; }
  const ps=e.target.closest('[data-pk-s]');
  if(ps){ pick.s=ps.dataset.pkS; pick.x=null; renderPlaceSheet(); return; }
  const px=e.target.closest('[data-pk-x]');
  if(px){ pick.x=px.dataset.pkX; renderPlaceSheet(); return; }
  if(e.target.id==='pk-place'){ placePicked(); return; }
  const pi=e.target.closest('[data-pick-inbox]');
  if(pi){
    const id=pi.dataset.pickInbox;
    const item=(plan.inbox||[]).find(x=>x.id===id);
    if(item){ plan.inbox=plan.inbox.filter(x=>x.id!==id); placeTask(item.text, 25, null); }
    return;
  }
});
document.getElementById('sheet').addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='pk-note' && !e.isComposing){ e.preventDefault(); placePicked(); }
});

/* ---------- 計画（projects.json の編集。週次レビュー用） ----------
   day-clock はこれを読むだけ。id は型の id（大/中/小）になるので、作ったら変えない＝名前は自由に直せる */
const planEl=document.getElementById('plan');
let ed=null, edErr='', es=null, edOrig='';   // es = いま開いている工程（null なら大の段）。edOrig = 開いたときの中身
const edChanged=()=>!!ed && JSON.stringify(ed)!==edOrig;
function edGo(si){ es=si; edErr=''; renderPlan(); planEl.querySelector('.panel').scrollTop=0; }
const BLOCK_LABELS=(function(){ const s=[]; for(const k in BASE_SCHEDULE) for(const b of BASE_SCHEDULE[k]) if(s.indexOf(b.label)<0) s.push(b.label); return s; })();
const val=v=>esc(v==null?'':String(v)).replace(/"/g,'&quot;');
/* 日付欄には上限を付ける。max が無いと Chrome は年を 6 桁（275760 年まで）受け付け、
   8 桁を続けて打つと年に 6 桁入ってしまう。上限があると年は 4 桁で止まり、月へ自動で進む */
const DATE_IN='<input type="date" min="2000-01-01" max="9999-12-31" ';
const fld=(label,input)=>'<div><label class="f">'+label+'</label>'+input+'</div>';
function newStage(){ return {id:uid(), name:'', due:null, criteria:'', doneAt:null, evidence:'', presets:[newPreset()]}; }
function newPreset(){ return {id:uid(), text:'', min:15}; }

function openPlan(){ ed=null; es=null; edErr=''; renderPlan(); planEl.hidden=false; }
function renderPlan(){
  const body=document.getElementById('plan-body'), title=document.getElementById('plan-title');
  if(!projects){ title.textContent='計画'; body.innerHTML='<div class="empty">読み込み前です。設定からトークンを入れてください</div>'; return; }
  if(!ed){
    title.textContent='計画';
    const row=p=>{
      const ms=(p.stages||[]).filter(s=>s.due), dn=ms.filter(s=>s.doneAt).length;
      return '<div class="row" data-ed="'+esc(p.id)+'"><span class="dot" style="background:'+esc(p.color||'#888')+'"></span>'+
        '<div class="rtxt">'+esc(p.name)+(p.draft?' <span class="badge">仮</span>':'')+
        '<div class="act">'+(p.goal&&p.goal.due?'◆ '+md(p.goal.due)+' · ':'')+esc((p.goal&&p.goal.text)||'ゴール未設定')+'</div></div>'+
        '<div class="rmin">'+(ms.length?dn+'/'+ms.length+' 工程':'継続のみ')+' ›</div></div>';
    };
    const act=projList().filter(p=>!p.archived), arc=projList().filter(p=>p.archived);
    body.innerHTML=(act.map(row).join('')||'<div class="empty">プロジェクトがありません</div>')+
      '<button class="add" data-ed-new="1">＋ プロジェクトを追加</button>'+
      (arc.length?'<div class="sec">アーカイブ</div>'+arc.map(row).join(''):'')+
      '<p class="hint">週次レビューで見直す。工程の完了は、完了条件に対する証拠を書いてから。'+
      '「仮」は初期案のまま見直していないもの。開いて保存すると外れる。</p>';
    return;
  }
  // 置くときと同じく 大 → 中 → 小 の順にたどる。保存はプロジェクト単位で、どの段からでもできる
  const pname=ed.name||'新しいプロジェクト', S=ed.stages[es];
  title.textContent=S ? (S.name||'新しい工程') : pname;
  let h='<div class="crumbs"><button class="crumb" data-ed-op="back">計画</button>›'+
        (S ? '<button class="crumb" data-ed-op="proj">'+esc(pname)+'</button>›<b>'+esc(S.name||'新しい工程')+'</b>'
           : '<b>'+esc(pname)+'</b>')+'</div>';
  if(ed.draft) h+='<p class="hint warnbox">この計画は仮の案です。見直して保存すると「仮」が外れます。</p>';
  h+= S ? stageEditor(S, es) : projectLevel();
  h+='<div class="edfoot">'+(edErr?'<div class="err">'+esc(edErr)+'</div>':'')+
     '<button class="btn pri" data-ed-op="save">保存</button>'+
     (S ? '<button class="btn" data-ed-op="proj">← 工程の一覧</button>'
        : '<button class="btn" data-ed-op="archive">'+(ed.archived?'アーカイブから戻す':'アーカイブ')+'</button>')+
     (edChanged() ? '<span class="unsaved">未保存の変更あり</span>' : '')+'</div>';
  body.innerHTML=h;
}
/* 大（プロジェクト）の段: 工程の一覧が主役。プロジェクト自体の設定は下にたたむ（名前が無い＝新規のときだけ開く） */
const ST_TXT={done:'完了', active:'進行中', late:'期限切れ', todo:'未着手', cont:'継続の練習'};
function projectLevel(){
  let h='<div class="sec">中 · 工程</div>';
  h+=ed.stages.map((s,si)=>{
    const st=stageStatus(ed,s), n=(s.presets||[]).length;
    const when=s.doneAt ? '完了 '+md(s.doneAt) : s.due ? ST_TXT[st]+' · 期日 '+md(s.due) : '継続の練習（期日なし）';
    return '<div class="row'+(s.doneAt?' dim':'')+'" data-ed-op="stage-open:'+si+'"><div class="rtxt">'+esc(s.name||'（名前なし）')+
      '<div class="act'+(st==='late'?' late':'')+'">'+when+'</div></div><div class="rmin">型 '+n+' ›</div></div>';
  }).join('') || '<div class="empty">工程がありません</div>';
  h+='<button class="add" data-ed-op="stage-add">＋ 工程を追加</button>';
  h+='<details class="psettings"'+(ed.name?'':' open')+'><summary>プロジェクトの設定 — 名前・ゴール・期限・週の目標・色</summary>';
  h+=fld('名前','<input type="text" data-f="name" value="'+val(ed.name)+'">');
  h+=fld('ゴール（最終成果物）','<input type="text" data-f="goal.text" value="'+val(ed.goal.text)+'" placeholder="例: ワールドを VRChat に公開する">');
  h+='<div class="grid2">'+fld('期限',DATE_IN+'data-f="goal.due" value="'+val(ed.goal.due)+'">')+
     fld('始めた日',DATE_IN+'data-f="start" value="'+val(ed.start)+'">')+'</div>';
  h+='<div class="grid2">'+fld('週の目標（分）','<input type="number" min="0" max="3000" step="10" data-f="weekly.min" value="'+val(ed.weekly.min)+'">')+
     fld('週の目標（回）','<input type="number" min="0" max="100" step="1" data-f="weekly.count" value="'+val(ed.weekly.count)+'">')+'</div>';
  h+='<div class="grid2">'+fld('色','<input type="color" data-f="color" value="'+val(ed.color||'#8d97ab')+'">')+'<div></div></div>';
  h+=fld('出しやすいブロック（置くときに先頭に並ぶ）','<div class="chips">'+BLOCK_LABELS.map(l=>
       '<label class="chip"><input type="checkbox" data-f="blocks" value="'+val(l)+'" '+(ed.blocks.indexOf(l)>=0?'checked':'')+'>'+esc(l)+'</label>').join('')+'</div>');
  return h+'</details>';
}
/* 中（工程）の段: 工程の名前・期日・完了条件と、その下の 小（1 手の型） */
function stageEditor(s,si){
  let h='<div class="stage'+(s.doneAt?' done':'')+'">';
  h+='<label class="f" style="margin-top:0">工程の名前</label>';
  h+='<div class="srow"><input type="text" data-f="s:'+si+':name" value="'+val(s.name)+'" placeholder="例: ブロックアウト">'+
     '<button class="mini" data-ed-op="stage-up:'+si+'" aria-label="前の工程と入れ替える">↑</button>'+
     '<button class="mini" data-ed-op="stage-down:'+si+'" aria-label="後の工程と入れ替える">↓</button>'+
     '<button class="mini" data-ed-op="stage-del:'+si+'" aria-label="工程を削除">×</button></div>';
  h+=fld('期日（空 = 期日のない継続の練習）',DATE_IN+'data-f="s:'+si+':due" value="'+val(s.due)+'">');
  if(s.due){
    h+=fld('完了条件（何ができたら終わりか。物理的な証拠で）','<input type="text" data-f="s:'+si+':criteria" value="'+val(s.criteria)+'">');
    if(s.doneAt){
      h+='<div class="donebox">完了 '+md(s.doneAt)+' · 証拠: '+esc(s.evidence)+
         '<button class="mini" data-ed-op="stage-undone:'+si+'" style="margin-left:auto">取り消す</button></div>';
    }else{
      h+='<div class="donebox"><input type="text" data-f="s:'+si+':evidence" value="'+val(s.evidence)+'" placeholder="証拠（例: 書き出したファイル名・スクショ）">'+
         '<button class="mini" data-ed-op="stage-done:'+si+'">完了にする</button></div>';
    }
  }
  h+='</div><div class="sec">小 · 1手の型</div>';
  s.presets.forEach((x,xi)=>{
    h+='<div class="prow"><input type="text" data-f="x:'+si+':'+xi+':text" value="'+val(x.text)+'" placeholder="身体が始められる動作で、量は1">'+
       '<input type="number" min="1" max="240" data-f="x:'+si+':'+xi+':min" value="'+val(x.min)+'"><span class="rmin">分</span>'+
       '<button class="mini" data-ed-op="preset-del:'+si+':'+xi+'" aria-label="型を削除">×</button></div>';
  });
  if(!s.presets.length) h+='<div class="empty">型がありません</div>';
  h+='<button class="add small" data-ed-op="preset-add:'+si+'">＋ 型を追加</button>';
  return h;
}
/* 入力は ed に写すだけ（再描画するとフォーカスが外れるため） */
function onPlanInput(e){
  const k=e.target.dataset && e.target.dataset.f; if(!k || !ed) return;
  const v=e.target.value;
  if(k==='blocks'){ ed.blocks=Array.prototype.map.call(planEl.querySelectorAll('[data-f=blocks]:checked'),x=>x.value); return; }
  const p=k.split(':');
  if(p[0]==='s'){
    const s=ed.stages[Number(p[1])];
    if(p[2]==='due'){ const had=!!s.due; s.due=v||null; if(had!==!!s.due) renderPlan(); }   // 期日の有無で欄が変わる
    else s[p[2]]=v;
    return;
  }
  if(p[0]==='x'){ const x=ed.stages[Number(p[1])].presets[Number(p[2])]; x[p[3]] = p[3]==='min' ? Number(v) : v; return; }
  if(k==='goal.text') ed.goal.text=v;
  else if(k==='goal.due') ed.goal.due=v||null;
  else if(k==='weekly.min') ed.weekly.min=Math.max(0,Number(v)||0);
  else if(k==='weekly.count') ed.weekly.count=Math.max(0,Number(v)||0);
  else ed[k]=v;
}
planEl.addEventListener('input', onPlanInput);
planEl.addEventListener('change', onPlanInput);

/* 直すべき場所を返す。工程の中の問題なら si を付け、保存を押した段から工程の段へ連れて行く */
function validateEd(){
  if(!String(ed.name).trim()) return {msg:'名前を入れてください（プロジェクトの設定）', si:null};
  if(!ed.stages.length) return {msg:'工程を1つ以上作ってください', si:null};
  for(let si=0; si<ed.stages.length; si++){
    const s=ed.stages[si];
    if(!String(s.name).trim()) return {msg:'工程の名前を入れてください', si};
    if(!s.presets.length) return {msg:'「'+s.name+'」に型がありません', si};
    for(const x of s.presets){
      if(!String(x.text).trim()) return {msg:'「'+s.name+'」に文言の無い型があります', si};
      if(!(x.min>=1 && x.min<=240)) return {msg:'「'+String(x.text).slice(0,12)+'」の分数は 1〜240 で', si};
    }
  }
  return null;
}
async function savePlanEdit(){
  if(!cfg.token){ edErr='設定からトークンを入れてください'; renderPlan(); return; }
  const bad=validateEd();
  if(bad){ es=bad.si; edErr=bad.msg; renderPlan(); return; }   // 名前が空ならプロジェクトの設定は開いた状態で出る
  edErr='';
  const copy=JSON.parse(JSON.stringify(ed));
  copy.name=copy.name.trim();
  copy.goal.text=String(copy.goal.text||'').trim();
  for(const s of copy.stages){
    s.name=s.name.trim(); s.criteria=String(s.criteria||'').trim();
    if(!s.due){ s.criteria=''; s.doneAt=null; s.evidence=''; }   // 継続の練習に完了は無い
    for(const x of s.presets) x.text=x.text.trim();
  }
  delete copy.draft;
  const list=projects.projects, i=list.findIndex(p=>p.id===copy.id), orig=i>=0?list[i]:null;
  if(i>=0) list[i]=copy; else list.push(copy);
  try{
    setStatus('計画を保存中…');
    shaProjects=await ghPut('projects.json', JSON.stringify(projects,null,2)+'\n', shaProjects, 'projects: 計画を更新（'+copy.name+'）');
    cacheLocal();
    setStatus('計画を保存しました（'+copy.name+'）');
    ed=null; es=null; edErr=''; renderPlan(); render();
  }catch(e){
    if(i>=0) list[i]=orig; else list.pop();
    edErr=e.conflict?'他の端末で計画が更新されています。閉じて再読み込みしてから、もう一度直してください':e.message;
    renderPlan();
  }
}
planEl.addEventListener('click', function(e){
  if(e.target.id==='plan'){ planEl.hidden=true; return; }
  const open=e.target.closest('[data-ed]');
  if(open){ const p=projList().find(x=>x.id===open.dataset.ed); if(p){ ed=JSON.parse(JSON.stringify(p)); edErr='';
    ed.goal=ed.goal||{text:'',due:null}; ed.weekly=ed.weekly||{min:0,count:0}; ed.blocks=ed.blocks||[]; ed.stages=ed.stages||[];
    edOrig=JSON.stringify(ed); edGo(null); } return; }
  if(e.target.closest('[data-ed-new]')){
    ed={id:uid(), name:'', color:'#8d97ab', blocks:[], start:ymd(new Date()), archived:false,
        goal:{text:'',due:null}, weekly:{min:0,count:0}, stages:[]};
    edOrig=''; edGo(null); return;
  }
  const b=e.target.closest('[data-ed-op]'); if(!b || !ed) return;
  const p=b.dataset.edOp.split(':'), op=p[0], si=Number(p[1]), xi=Number(p[2]);
  const S=ed.stages;
  if(op==='back'){
    if(edChanged() && !confirm('保存していない変更があります。捨てて一覧に戻りますか？')) return;
    ed=null; es=null; edErr=''; renderPlan(); return;
  }
  if(op==='proj'){ edGo(null); return; }
  if(op==='stage-open'){ edGo(si); return; }
  if(op==='save'){ savePlanEdit(); return; }
  if(op==='archive'){ ed.archived=!ed.archived; savePlanEdit(); return; }
  if(op==='stage-add'){ S.push(newStage()); edGo(S.length-1); return; }
  else if(op==='stage-up' && si>0){ const t=S[si]; S[si]=S[si-1]; S[si-1]=t; es=si-1; }
  else if(op==='stage-down' && si<S.length-1){ const t=S[si]; S[si]=S[si+1]; S[si+1]=t; es=si+1; }
  else if(op==='stage-del'){ if(!confirm('工程「'+(S[si].name||'（名前なし）')+'」を削除しますか？\n過去の1手はプロジェクトの記録としては残ります')) return; S.splice(si,1); edGo(null); return; }
  else if(op==='stage-done'){
    // 証拠が無いものは完了にしない（「理解した」「だいたいできた」で閉じないため）
    if(!String(S[si].evidence||'').trim()){ edErr='「'+S[si].name+'」の証拠を書いてから完了にしてください'; renderPlan(); return; }
    S[si].doneAt=ymd(new Date());
  }
  else if(op==='stage-undone'){ S[si].doneAt=null; }
  else if(op==='preset-add') S[si].presets.push(newPreset());
  else if(op==='preset-del') S[si].presets.splice(xi,1);
  edErr=''; renderPlan();
});
document.getElementById('plan-btn').addEventListener('click', openPlan);
document.getElementById('plan-close').addEventListener('click', function(){ planEl.hidden=true; });

/* 設定 */
const stEl=document.getElementById('settings');
document.getElementById('settings-btn').addEventListener('click', function(){
  document.getElementById('cfg-repo').value=cfg.repo||'';
  document.getElementById('cfg-token').value=cfg.token||'';
  document.getElementById('cfg-ntfy').value=cfg.ntfy||'';
  document.getElementById('cfg-before').value=cfg.notifyBefore||5;
  document.getElementById('cfg-include').checked=!!cfg.notifyIncludeTask;
  stEl.hidden=false;
});
document.getElementById('cfg-test').addEventListener('click', async function(){
  const topic=document.getElementById('cfg-ntfy').value.trim();
  if(!topic){ setStatus('先に ntfy トピックを入れてください', true); return; }
  try{
    await ntfyPublish({topic:topic, title:'板 — テスト通知', message:'この通知が届けば設定できています', tags:['white_check_mark']});
    setStatus('テスト通知を送りました');
  }catch(e){ setStatus(e.message, true); }
  stEl.hidden=true;
});
document.getElementById('settings-close').addEventListener('click', function(){ stEl.hidden=true; });
stEl.addEventListener('click', function(e){ if(e.target.id==='settings') stEl.hidden=true; });
document.getElementById('cfg-save').addEventListener('click', function(){
  cfg.repo=document.getElementById('cfg-repo').value.trim()||'landroute/plan-data';
  cfg.token=document.getElementById('cfg-token').value.trim();
  cfg.ntfy=document.getElementById('cfg-ntfy').value.trim();
  cfg.notifyBefore=Math.max(1,Math.min(60,Number(document.getElementById('cfg-before').value)||5));
  cfg.notifyIncludeTask=document.getElementById('cfg-include').checked;
  saveCfg(); stEl.hidden=true; loadAll();
});
document.getElementById('cfg-clear').addEventListener('click', function(){
  cfg.token=''; saveCfg(); document.getElementById('cfg-token').value='';
  setStatus('トークンを消しました', true);
});

window.addEventListener('online', function(){ if(dirty) save(); });
setInterval(function(){ if(dayOffset===0) renderTimeline(); }, 60000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
render();
loadAll();
